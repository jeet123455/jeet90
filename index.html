<!DOCTYPE html>
<html>
<head>
<title>Student Login - MCQ Exam</title>
<link rel="stylesheet" href="style.css">
</head>  
<body class="Login-page">
<div class="Login-container">
<h2>Student Exam Login</h2>
<form id="LoginForm">
<input type="text" id="StudentName" placeholder="Student Name" required>
<input type="text" id="StudentName" placeholder="Student ID" required>
<input type="text" id="Teacher Name" placeholder="Student Teacher Name" required>
<input type="password" id="examPassword" placeholder="Exam password" required>
<button type="submit">Enter Exam</button>
</form>
</div>
<script src="script.js"></script>
</body>
</html>
